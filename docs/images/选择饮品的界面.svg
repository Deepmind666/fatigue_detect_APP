  <!-- 菜单卡片 -->
  <g fill="none" stroke="#e5e5e5">
    <rect x="48" y="112" width="260" height="180" rx="12" fill="#fff"/>
    <rect x="328" y="112" width="260" height="180" rx="12" fill="#fff"/>
    <rect x="608" y="112" width="260" height="180" rx="12" fill="#fff"/>
    <rect x="888" y="112" width="260" height="180" rx="12" fill="#fff"/>
  </g>
  <!-- 点击高亮 -->
