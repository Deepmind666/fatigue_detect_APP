<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="100%" height="100%" fill="#f5f7fa"/>
  <!-- 蒙层 -->
  <rect x="0" y="0" width="1200" height="720" fill="#000" opacity="0.25"/>
  <!-- 弹窗 -->
  <rect x="240" y="120" width="720" height="480" rx="16" fill="#fff" stroke="#e5e5e5"/>
  <text x="272" y="168" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="22" fill="#333">自定义</text>
  <!-- 选项：杯型 -->
  <text x="272" y="216" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="16" fill="#666">杯型</text>
  <rect x="272" y="232" width="80" height="36" rx="8" fill="#1677ff"/>
  <text x="292" y="256" font-size="14" fill="#fff" font-family="Segoe UI, Microsoft YaHei, Arial">中杯</text>
  <rect x="360" y="232" width="80" height="36" rx="8" fill="#f0f0f0" stroke="#d9d9d9"/>
  <text x="384" y="256" font-size="14" fill="#333" font-family="Segoe UI, Microsoft YaHei, Arial">大杯</text>
  <!-- 选项：加冰 -->
  <text x="272" y="302" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="16" fill="#666">加冰</text>
  <rect x="272" y="318" width="80" height="36" rx="8" fill="#1677ff"/>
  <text x="284" y="342" font-size="14" fill="#fff" font-family="Segoe UI, Microsoft YaHei, Arial">正常冰</text>
  <rect x="360" y="318" width="80" height="36" rx="8" fill="#f0f0f0" stroke="#d9d9d9"/>
  <text x="384" y="342" font-size="14" fill="#333" font-family="Segoe UI, Microsoft YaHei, Arial">少冰</text>
  <rect x="448" y="318" width="80" height="36" rx="8" fill="#f0f0f0" stroke="#d9d9d9"/>
  <text x="472" y="342" font-size="14" fill="#333" font-family="Segoe UI, Microsoft YaHei, Arial">去冰</text>
  
  <!-- 底部按钮 -->
  <rect x="760" y="526" width="160" height="44" rx="8" fill="#52c41a"/>
  <text x="812" y="555" font-size="16" fill="#fff" font-family="Segoe UI, Microsoft YaHei, Arial">确认下单</text>
</svg>