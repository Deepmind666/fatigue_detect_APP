syntax = "proto3";
package chakra.moe;

// Minimal MoE-oriented Chakra-like schema for simulation interchange
message Metadata {
  int32 world_size = 1;         // number of ranks
  int32 npus_per_node = 2;      // optional
  string parallelism = 3;       // e.g., "dp+ep"
  string network = 4;           // e.g., "ring-npus=4"
  uint64 bytes_per_token = 5;   // payload size
  string version = 6;           // schema/version tag
}

enum CollectiveType {
  ALL_TO_ALL = 0;
  ALL_REDUCE = 1;
  ALL_GATHER = 2;
  REDUCE_SCATTER = 3;
  SEND_RECV = 4;
}

message Flow {
  int32 src_rank = 1;
  int32 dst_rank = 2;
  uint64 num_bytes = 3;
  string tensor = 4;       // logical tensor label (e.g., "tokens")
  string step_id = 5;      // step identifier
  int32 phase_index = 6;   // phase within the step
  string label = 7;        // human-readable annotation
}

message Collective {
  CollectiveType type = 1;
  repeated int32 ranks = 2; // participants
  repeated Flow flows = 3;
  string tensor = 4;        // logical tensor name
}

message Phase {
  int32 index = 1;         // 0..N-1
  string name = 2;         // e.g., "dispatch", "expert_compute", "combine"
  repeated Collective collectives = 3;
  uint64 compute_cycles = 4; // optional placeholder for compute cost
}

message Step {
  string id = 1;           // step id
  uint64 tokens = 2;       // tokens per step
  double capacity_factor = 3;
  int32 experts = 4;       // total experts
  int32 top_k = 5;         // MoE top-k routing
  string routing = 6;      // e.g., "softmax"
  repeated Phase phases = 7;
}

message Trace {
  Metadata meta = 1;
  repeated Step steps = 2;
}