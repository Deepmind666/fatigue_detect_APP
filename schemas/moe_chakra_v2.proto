syntax = "proto3";
package chakra.moe.v2;

message Metadata {
  int32 world_size = 1;
  int32 npus_per_node = 2;
  string parallelism = 3;           // e.g., "dp+ep"
  string topology = 4;               // e.g., "ring-npus=4"
  double network_bw_gbps = 5;        // link bandwidth
  uint64 network_lat_ns = 6;         // per-hop latency
  uint64 bytes_per_token = 7;
  string version = 8;                // "moe-chakra-v2"
}

enum CollectiveType {
  ALL_TO_ALL = 0;
  ALL_REDUCE = 1;
  ALL_GATHER = 2;
  REDUCE_SCATTER = 3;
}

message Flow {
  int32 src_rank = 1;
  int32 dst_rank = 2;
  uint64 num_bytes = 3;
  string tensor = 4;
  string step_id = 5;
  int32 phase_index = 6;
  string label = 7;
}

message Collective {
  CollectiveType type = 1;
  repeated int32 ranks = 2;
  repeated Flow flows = 3;
  string tensor = 4;
  string algorithm = 5;            // e.g., "ring", "tree", "bucket"
}

message Phase {
  int32 index = 1;
  string name = 2;
  repeated Collective collectives = 3;
  uint64 compute_cycles = 4;
}

message Step {
  string id = 1;
  uint64 tokens = 2;
  double capacity_factor = 3;
  int32 experts = 4;
  int32 top_k = 5;
  string routing = 6;              // e.g., "softmax"
  double weights_skew = 7;         // distribution skew parameter
  repeated Phase phases = 8;
}

message Trace {
  Metadata meta = 1;
  repeated Step steps = 2;
}