<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>纯白背景预览</title>
    <style>
      body { margin: 0; background: #fff; color: #333; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .wrap { position: relative; height: 100vh; display: grid; place-items: center; }
      .cap { position: absolute; left: 16px; bottom: 16px; background: rgba(0,0,0,0.08); padding: 8px 12px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>纯白背景（不使用广告页图片）</div>
      <div class="cap">预览仅用于视觉确认：白色背景</div>
    </div>
  </body>
  </html>
